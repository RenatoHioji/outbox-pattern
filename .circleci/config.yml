version: 2.1

jobs:
  build-and-test:
    parameters:
      service_dir:
        type: string
    docker:
      - image: cimg/go:1.26
    working_directory: ~/project/<< parameters.service_dir >>
    environment:
      GOWORK: "off"
    steps:
      - checkout:
          path: ~/project

      - restore_cache:
          name: Restore Go module and build cache (<< parameters.service_dir >>)
          keys:
            - go-cache-v1-<< parameters.service_dir >>-{{ checksum "go.sum" }}
            - go-cache-v1-<< parameters.service_dir >>-

      - run:
          name: Build << parameters.service_dir >>
          command: go build -v ./...

      - run:
          name: Run unit tests (<< parameters.service_dir >>)
          command: |
            mkdir -p test-results
            gotestsum --junitfile test-results/junit.xml -- -race ./...

      - store_test_results:
          path: test-results

      - save_cache:
          name: Save Go module and build cache (<< parameters.service_dir >>)
          key: go-cache-v1-<< parameters.service_dir >>-{{ checksum "go.sum" }}
          paths:
            - /home/circleci/go/pkg/mod
            - /home/circleci/.cache/go-build

  integration-test:
    docker:
      - image: cimg/go:1.26
        environment:
          GOWORK: "off"
          DEBEZIUM_DB_HOST: "localhost"
      - image: postgres:16-alpine
        environment:
          POSTGRES_USER: outbox_user
          POSTGRES_PASSWORD: outbox_password
          POSTGRES_DB: outbox_db
        command: ["postgres", "-c", "wal_level=logical"]
      - image: apache/kafka:3.8.0
        environment:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_NUM_PARTITIONS: 3
      - image: quay.io/debezium/connect:2.7
        environment:
          BOOTSTRAP_SERVERS: localhost:29092
          GROUP_ID: 1
          CONFIG_STORAGE_TOPIC: connect_configs
          OFFSET_STORAGE_TOPIC: connect_offsets
          STATUS_STORAGE_TOPIC: connect_statuses
          CONFIG_STORAGE_REPLICATION_FACTOR: 1
          OFFSET_STORAGE_REPLICATION_FACTOR: 1
          STATUS_STORAGE_REPLICATION_FACTOR: 1
          KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
          VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
          VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    steps:
      - checkout

      - run:
          name: Wait for PostgreSQL, Kafka, and Debezium Connect
          command: |
            dockerize -wait tcp://localhost:5432 -wait tcp://localhost:9092 -wait http://localhost:8083/connectors -timeout 90s

      - run:
          name: Run system integration and CDC end-to-end tests
          working_directory: ~/project/test
          command: |
            mkdir -p ../test-results
            gotestsum --junitfile ../test-results/integration.xml -- -v -race ./...

      - store_test_results:
          path: test-results

workflows:
  ci:
    jobs:
      - build-and-test:
          name: test-order-api
          service_dir: order-api
      - build-and-test:
          name: test-order-consumer
          service_dir: order-consumer
      - integration-test:
          requires:
            - test-order-api
            - test-order-consumer
